<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio & Resume | YazzMedia</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Syne:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0d14;
  --bg2: #13131f;
  --bg3: #1a1a2a;
  --lavender: #9b93f0;
  --lavender-light: #c4bff7;
  --lavender-dim: #3d3870;
  --lavender-glow: rgba(155,147,240,0.12);
  --white: #ffffff;
  --off-white: #e8e6f0;
  --muted: #8888aa;
  --border: rgba(155,147,240,0.2);
  --border-light: rgba(255,255,255,0.06);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Syne',sans-serif;background:var(--bg);color:var(--off-white);font-size:16px;line-height:1.6;}

/* NAV */
nav{position:sticky;top:0;z-index:100;background:rgba(13,13,20,0.92);border-bottom:0.5px solid var(--border);padding:0 6%;display:flex;align-items:center;justify-content:space-between;height:64px;backdrop-filter:blur(12px);}
.nav-logo{font-family:'Playfair Display',serif;font-size:18px;color:var(--white);letter-spacing:0.04em;text-decoration:none;}
.nav-logo span{color:var(--lavender);font-style:italic;}
.nav-links{display:flex;gap:2.5rem;list-style:none; flex-wrap: wrap; justify-content: center;}
.nav-links a{text-decoration:none;font-size:12px;font-weight:400;color:var(--muted);letter-spacing:0.12em;text-transform:uppercase;transition:color 0.2s;}
.nav-links a:hover, .nav-links a.active{color:var(--lavender);}

/* BUTTONS */
.btn-primary{display:inline-block;padding:12px 32px;background:var(--lavender);color:var(--bg);text-decoration:none;font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;transition:background 0.2s;}
.btn-primary:hover{background:var(--lavender-light);}
.btn-secondary{display:inline-block;padding:12px 32px;border:0.5px solid var(--border);color:var(--lavender);text-decoration:none;font-size:12px;font-weight:400;letter-spacing:0.1em;text-transform:uppercase;transition:border-color 0.2s,color 0.2s;}
.btn-secondary:hover{border-color:var(--lavender);color:var(--lavender-light);}

/* SECTIONS */
.section-wrap{padding:5rem 6%;max-width:100%;}
.section-inner{max-width:1100px;margin:0 auto;}
.section-header{display:flex;align-items:center;gap:16px;margin-bottom:3.5rem;}
.section-title{font-size:12px;font-weight:500;letter-spacing:0.15em;text-transform:uppercase;color:var(--lavender);}
.section-line{flex:1;height:0.5px;background:var(--border);}

/* SKILLS */
.skills-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
.skill-item{background:var(--bg2);border:0.5px solid var(--border-light);border-radius:4px;padding:14px 18px;font-size:13px;color:var(--off-white);display:flex;align-items:center;gap:10px;transition:border-color 0.2s,background 0.2s;font-weight:300;}
.skill-item:hover{border-color:var(--lavender);background:var(--lavender-glow);}
.skill-dot{width:6px;height:6px;border-radius:50%;background:var(--lavender);flex-shrink:0;}

/* EDUCATION LIST */
.exp-list{display:flex;flex-direction:column;gap:0;}
.exp-item{display:grid;grid-template-columns:200px 1fr;border-bottom:0.5px solid var(--border-light);padding:2.5rem 0;gap:3rem;transition:background 0.2s;}
.exp-item:first-child{border-top:0.5px solid var(--border-light);}
.exp-item:hover{background:var(--lavender-glow);}
.exp-meta{padding-left:0;}
.exp-date{font-size:11px;color:var(--lavender);letter-spacing:0.1em;margin-bottom:8px;text-transform:uppercase;}
